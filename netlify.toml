# Body Belonging Clinic — Netlify configuration
# Static site: no build step, publish the repository root as-is.

[build]
  publish = "."
  command = ""

# ---------------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------------
# The site shipped with none of these. All of the headers below are safe for a
# static site and cannot break rendering.
#
# Content-Security-Policy is deliberately set to REPORT-ONLY for now. It is
# scoped to the third parties the site actually uses (Google Fonts, GA/GTM,
# Microsoft Clarity, MailerLite forms, Zanda booking, Instagram embeds).
# Watch the browser console for violations for a couple of weeks, then rename
# the header to Content-Security-Policy to enforce it.

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options    = "nosniff"
    X-Frame-Options           = "SAMEORIGIN"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "geolocation=(), microphone=(), camera=(), payment=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy-Report-Only = """
      default-src 'self'; \
      base-uri 'self'; \
      form-action 'self' https://preview.mailerlite.io; \
      frame-ancestors 'self'; \
      object-src 'none'; \
      img-src 'self' data: https:; \
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
      font-src 'self' https://fonts.gstatic.com data:; \
      script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.clarity.ms https://connect.facebook.net https://preview.mailerlite.io; \
      connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://www.googletagmanager.com https://*.clarity.ms https://preview.mailerlite.io; \
      frame-src https://clientportal.zandahealth.com https://www.instagram.com https://www.google.com; \
      upgrade-insecure-requests"""

# ---------------------------------------------------------------------------
# Caching
# ---------------------------------------------------------------------------
# Assets are referenced by stable filenames, so cache them hard but allow
# revalidation. HTML must always revalidate so content edits go live at once.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
