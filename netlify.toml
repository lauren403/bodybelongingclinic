# Body Belonging Clinic — Netlify configuration
# Static site: no build step, publish the repository root as-is.

[build]
  publish = "."
  command = ""

# ---------------------------------------------------------------------------
# Security headers
# ---------------------------------------------------------------------------
# The site shipped with none of these. All of the headers below are safe for a
# static site and cannot break rendering.
#
# Content-Security-Policy is deliberately set to REPORT-ONLY for now. It is
# scoped to the third parties the site actually uses (Google Fonts, GA/GTM,
# Microsoft Clarity, MailerLite forms, Zanda booking, Instagram embeds).
# Verified against real traffic 20 Aug 2026. What the site actually loads:
#   scripts.clarity.ms + www.clarity.ms + v.clarity.ms  (Microsoft Clarity)
#   www.googletagmanager.com                            (GA4 G-EKE17QFG2S)
#   connect.facebook.net + www.facebook.com/tr          (Meta pixel)
#   fonts.googleapis.com + fonts.gstatic.com            (webfonts)
#   clientportal.zandahealth.com                        (booking iframe)
# All are allowed above. Watch the console for a couple of weeks, then rename
# the header to Content-Security-Policy to enforce it.

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options    = "nosniff"
    X-Frame-Options           = "SAMEORIGIN"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "geolocation=(), microphone=(), camera=(), payment=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy-Report-Only = """
      default-src 'self'; \
      base-uri 'self'; \
      form-action 'self' https://preview.mailerlite.io; \
      frame-ancestors 'self'; \
      object-src 'none'; \
      img-src 'self' data: https:; \
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
      font-src 'self' https://fonts.gstatic.com data:; \
      script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://*.clarity.ms https://connect.facebook.net https://preview.mailerlite.io; \
      connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://www.googletagmanager.com https://*.clarity.ms https://www.facebook.com https://connect.facebook.net https://preview.mailerlite.io; \
      frame-src https://clientportal.zandahealth.com https://www.instagram.com https://www.google.com; \
      upgrade-insecure-requests"""

# ---------------------------------------------------------------------------
# Canonical host
# ---------------------------------------------------------------------------
# bodybelongingclinic.netlify.app serves the full site. The canonical tag already
# points at www, so Google consolidates correctly, but a 301 is cleaner: it stops
# the Netlify subdomain competing in search and keeps one address for the clinic.

# /fees is the URL people type and the one that goes in an email signature, but the
# fees content lives on /offerings. Send it there rather than 404.

[[redirects]]
  from = "/fees"
  to = "/offerings.html"
  status = 301
  force = true

[[redirects]]
  from = "/fees.html"
  to = "/offerings.html"
  status = 301
  force = true

[[redirects]]
  from = "https://bodybelongingclinic.netlify.app/*"
  to = "https://www.bodybelongingclinic.com.au/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Caching
# ---------------------------------------------------------------------------
# Asset filenames are stable and NOT content-hashed, so the TTL is deliberately
# short. A long TTL here is a trap: in Aug 2026 eleven photos were missing for two
# days, the edge cached those 404s, and they kept being served long after the files
# were restored. One day plus stale-while-revalidate means a replaced photo — or a
# cached miss — heals on its own. HTML always revalidates so copy edits go live at once.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
